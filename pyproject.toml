[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycopper"
version = "0.0.1"
description = "A GPU-accelerated declarative desktop GUI framework for Python"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "phil" }]
keywords = ["gui", "desktop", "wgpu", "webgpu", "material-design", "declarative"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
]

dependencies = [
    # windowing + graphics
    "wgpu>=0.32,<0.33",
    "rendercanvas>=2.7,<3",
    "glfw>=2.10",
    # data + validation
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "PyYAML>=6.0",
    "numpy>=2.0",
    # styling
    "materialyoucolor>=3.0,<4",
    "pillow>=11",
    # text stack (see ARCHITECTURE.md 2.3.1)
    "uharfbuzz>=0.56",
    "freetype-py>=2.5",
    "fonttools>=4.60",
    "python-bidi>=0.6",
    "uniseg>=0.10",
    # concurrency + tooling
    "anyio>=4.0",
    "watchfiles>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/phil/pycopper"

[tool.hatch.build.targets.wheel]
packages = ["src/pycopper"]

# ---------------------------------------------------------------- tooling

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: requires a working wgpu adapter (deselect with '-m \"not gpu\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["N803", "N806"]  # graphics math uses conventional capitalised names

[tool.mypy]
python_version = "3.12"
packages = ["pycopper"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["wgpu.*", "rendercanvas.*", "materialyoucolor.*", "freetype.*", "uharfbuzz.*", "uniseg.*", "bidi.*", "glfw.*"]
ignore_missing_imports = true
