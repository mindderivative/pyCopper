[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycopper"
version = "1.3.0"
description = "A GPU-accelerated declarative desktop GUI framework for Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/pycopper/assets/fonts/LICENSE-*.txt"]
requires-python = ">=3.12"
authors = [{ name = "phil" }]
keywords = ["gui", "desktop", "wgpu", "webgpu", "material-design", "declarative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

dependencies = [
    # windowing + graphics
    "wgpu>=0.32,<0.33",
    "rendercanvas>=2.7,<3",
    "glfw>=2.10",
    # data + validation
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "PyYAML>=6.0",
    "numpy>=2.0",
    # styling
    "materialyoucolor>=3.0,<4",
    "pillow>=11",
    # text stack (see ARCHITECTURE.md 2.3.1)
    "uharfbuzz>=0.56",
    "freetype-py>=2.5",
    "fonttools>=4.60",
    "python-bidi>=0.6",
    "uniseg>=0.10",
    # concurrency + tooling
    "anyio>=4.0",
    "watchfiles>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/mindderivative/pyCopper"
Source = "https://github.com/mindderivative/pyCopper"
Issues = "https://github.com/mindderivative/pyCopper/issues"
Architecture = "https://github.com/mindderivative/pyCopper/blob/main/ARCHITECTURE.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pycopper"]

[tool.hatch.build.targets.sdist]
# Ship what someone needs to build, test, and understand the package. Tooling
# caches, agent instructions, and CI config are not that -- and `M3-References`
# is 2.2MB of third-party material that is gitignored and must never ship.
include = [
    "/src/pycopper",
    "/tests",
    "/examples",
    "/README.md",
    "/ARCHITECTURE.md",
    "/LICENSE",
    "/pyproject.toml",
]

# ---------------------------------------------------------------- tooling

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: requires a working wgpu adapter (deselect with '-m \"not gpu\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["N803", "N806"]  # graphics math uses conventional capitalised names

[tool.ruff.lint.per-file-ignores]
# MVVM names a ViewModel module `*_ViewModel.py`; PEP 8 says module names are
# lower case. Those genuinely conflict, and this picks the convention a reader
# coming from MVVM will recognise. The framework accepts either casing, so a
# project that would rather satisfy N999 can use `*_viewmodel.py` instead.
"**/*_ViewModel.py" = ["N999"]

[tool.mypy]
python_version = "3.12"
packages = ["pycopper"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["wgpu.*", "rendercanvas.*", "materialyoucolor.*", "freetype.*", "uharfbuzz.*", "uniseg.*", "bidi.*", "glfw.*", "fontTools.*"]
ignore_missing_imports = true
