name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Menu Item"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "One row of a Menu: 48dp tall, 12dp side padding -- denser than a ListItem."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          `supporting_text:` is the trailing text (a keyboard shortcut,
          in practice), drawn `on_surface_variant` at the far edge.
          `style.has_submenu` swaps that trailing slot for a 24dp
          `chevron_right` instead -- the two trailing contents are
          mutually exclusive, a row that opens a submenu does not also
          carry its own shortcut. The submenu itself is a plain `Menu`
          overlay anchored to this item's own name. A MenuItem only
          makes sense inside a `Menu`, so this demo keeps one open
          permanently to show it; the item's own anatomy is the focus
          here, not the menu (which has its own demo).
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: Vertical
        style: {width: 240, background: surface_container_high, corner_radius: 4, padding: {top: 8, bottom: 8}}
        children:
          - {name: cut, widget: MenuItem, text: "Cut", supporting_text: "Ctrl+X"}
          - {name: copy, widget: MenuItem, text: "Copy", supporting_text: "Ctrl+C"}
          - {name: more, widget: MenuItem, text: "More tools", style: {has_submenu: true}}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
