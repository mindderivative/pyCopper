name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Column
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Button Group"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "M3 Expressive's button group: an invisible container that spaces buttons and, for the connected variant, merges their shape."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          "Button groups are invisible containers that add padding
          between buttons and modify button shape" -- quoted directly.
          Standard uses 8dp gaps and leaves every button fully rounded;
          connected uses 2dp gaps and squares every touching corner to
          8dp while the group's two outer ends stay fully round. Not
          built here: the width/shape morph animation M3's own demos show
          on press and selection, and the XS/S/M/L/XL size ladder --
          `Button` itself has only one size today.

          Use cases, from the spec: connected groups replace the
          deprecated segmented button for single- or multi-select
          patterns; standard groups just space related buttons -- like
          "Get started" next to a couple of icon-only actions -- without
          merging their shape.
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: Column
        style: {spacing: 16, width: expand}
        children:
          - {widget: Text, text: "Standard", style: {color: on_surface_variant}}
          - name: standard
            widget: ButtonGroup
            style: {variant: standard}
            children:
              - {widget: Button, text: "Copy", style: {variant: outlined}}
              - {widget: Button, text: "Cut", style: {variant: outlined}}
              - {widget: Button, text: "Paste", style: {variant: filled}}
          - {widget: Text, text: "Connected", style: {color: on_surface_variant}}
          - name: connected
            widget: ButtonGroup
            style: {variant: connected}
            children:
              - {widget: Button, text: "Day", style: {variant: outlined}}
              - {widget: Button, text: "Week", style: {variant: outlined}}
              - {widget: Button, text: "Month", style: {variant: outlined}}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Row
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
