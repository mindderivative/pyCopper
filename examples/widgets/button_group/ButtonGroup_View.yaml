name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Button Group"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "M3 Expressive's button group: an invisible container that spaces buttons, merges their shape when connected, and morphs a toggled button's shape (and, when standard, its width)."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          "Button groups are invisible containers that add padding
          between buttons and modify button shape" -- quoted directly.
          Standard uses 8dp gaps and leaves every button fully rounded;
          connected uses 2dp gaps and squares every touching corner to
          8dp while the group's two outer ends stay fully round. M size
          only -- the XS/S/M/L/XL size ladder isn't built (`Button` itself
          has one size today).

          Click a button below to toggle it: COMPONENT_BUTTONS.md's own
          "Corner sizes" table gives the shape morph exact dp figures --
          16dp when selected, 12dp while pressed (every button, not just
          grouped ones). A standard group's selected button ALSO grows
          width, visibly shifting its neighbours along the row -- an
          ordinary Flex reflow, not a special case; a connected group's
          selection changes shape only.

          Use cases, from the spec: standard groups space related toggle
          buttons -- like a formatting toolbar -- without merging their
          shape; connected groups replace the deprecated segmented button
          for single- or multi-select patterns.
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example -- click a button to toggle it"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: Vertical
        style: {spacing: 16, width: expand}
        children:
          - {widget: Text, text: "Standard", style: {color: on_surface_variant}}
          - name: standard
            widget: ButtonGroup
            style: {variant: standard}
            children:
              - name: bold
                widget: Button
                text: "Bold"
                value: "{{ bold.get() }}"
                style: {variant: outlined}
                handlers: {on_click: toggle_bold}
              - name: italic
                widget: Button
                text: "Italic"
                value: "{{ italic.get() }}"
                style: {variant: outlined}
                handlers: {on_click: toggle_italic}
              - name: underline
                widget: Button
                text: "Underline"
                value: "{{ underline.get() }}"
                style: {variant: outlined}
                handlers: {on_click: toggle_underline}
          - {widget: Text, text: "Connected", style: {color: on_surface_variant}}
          - name: connected
            widget: ButtonGroup
            style: {variant: connected}
            children:
              - name: day
                widget: Button
                text: "Day"
                value: "{{ day.get() }}"
                style: {variant: outlined}
                handlers: {on_click: toggle_day}
              - name: week
                widget: Button
                text: "Week"
                value: "{{ week.get() }}"
                style: {variant: outlined}
                handlers: {on_click: toggle_week}
              - name: month
                widget: Button
                text: "Month"
                value: "{{ month.get() }}"
                style: {variant: outlined}
                handlers: {on_click: toggle_month}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
