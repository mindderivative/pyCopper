name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Column
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Navigation Drawer"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "M3's navigation drawer: a 240-360dp wide column of destinations, with a full-radius active pill."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          300dp default width (clamped to a 360dp maximum), 56dp items,
          a full-radius pill behind the active destination. `text:` on
          each `NavItem` is the icon glyph, `supporting_text:` the label
          -- the same convention `NavigationRail` uses, since both are
          `_SelectionContainer`s under the hood.

          Use cases, from the spec: navigation drawers provide access to
          destinations and app functionality, such as switching accounts.
          They can be permanently on-screen or opened and closed by a menu
          icon; one navigation destination is always active.
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: Row
        style: {spacing: 16}
        children:
          - name: drawer
            widget: NavigationDrawer
            value: "{{ selected.get() }}"
            style: {height: 260}
            children:
              - {name: inbox, widget: NavItem, text: "inbox", supporting_text: "Inbox", handlers: {on_click: select}}
              - {name: starred, widget: NavItem, text: "star", supporting_text: "Starred", handlers: {on_click: select}}
              - {name: sent, widget: NavItem, text: "send", supporting_text: "Sent", handlers: {on_click: select}}
              - {name: trash, widget: NavItem, text: "delete", supporting_text: "Trash", handlers: {on_click: select}}
          - widget: Text
            text: "Selected: {{ selected.get() }}"
            style: {color: on_surface_variant}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Row
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
