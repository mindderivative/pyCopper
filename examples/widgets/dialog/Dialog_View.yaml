name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Dialog"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "M3's basic dialog: a modal window for critical information or a decision, in front of everything else."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          An optional 24dp icon, a headline (`text:`), supporting text
          (`supporting_text:`), and an actions area supplied as the
          single child, normally a Horizontal of buttons. Modality itself is
          the overlay host's job -- `open:` drives whether it's shown,
          `on_dismiss` fires when it closes (click outside, Escape, or a
          button inside it choosing to close).

          Use cases, from the spec: a dialog is a modal window that
          appears in front of app content to provide critical
          information or ask for a decision. Dialogs are purposefully
          interruptive, so they should be used sparingly -- a less
          disruptive alternative is a dropdown menu.
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: Horizontal
        style: {spacing: 16}
        children:
          - {name: trigger, widget: Button, text: "Delete item", style: {variant: filled}, handlers: {on_click: open_dialog}}
          - widget: Text
            text: "Dismissed {{ dismissals.get() }} times"
            style: {color: on_surface_variant}

      - name: dialog
        widget: Dialog
        open: "{{ dialog_open.get() }}"
        text: "Delete this item?"
        supporting_text: "This action cannot be undone."
        handlers: {on_dismiss: close_dialog}
        children:
          - widget: Horizontal
            style: {spacing: 8, main_alignment: end}
            children:
              - {widget: Button, text: "Cancel", style: {variant: text}, handlers: {on_click: close_dialog}}
              - {widget: Button, text: "Delete", style: {variant: filled}, handlers: {on_click: confirm_delete}}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
