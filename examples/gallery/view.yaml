# pyCopper widget gallery.
#
# Doubles as the corpus for the golden-image suite, so it deliberately
# exercises every widget kind and most style properties.
id: root
widget: Column
style:
  background: surface
  padding: 20
  spacing: 16
  width: expand
  height: expand
  cross_alignment: stretch

children:
  # --- header row: title, spacer pushing the action to the far edge ---
  - id: header
    widget: Row
    style: {height: 40, width: expand, cross_alignment: center}
    children:
      - id: title
        widget: Text
        text: "pyCopper gallery"
        style: {color: on_surface, font_size: 22}
      - id: header_gap
        widget: Spacer
        style: {width: expand}
      - id: theme_btn
        widget: Button
        text: "{{ 'Light' if dark.get() else 'Dark' }}"
        style:
          width: 96
          height: 40
          background: secondary_container
          color: on_secondary_container
          corner_radius: 20
        handlers: {on_click: toggle_theme}

  # --- elevated card containing wrapped body text ---
  - id: card
    widget: Container
    style:
      height: 92
      background: surface_container_high
      corner_radius: 16
      padding: 16
      border: {width: 1, color: outline_variant}
      shadow: {blur: 14, offset_y: 4, opacity: 0.4}
    children:
      - id: body
        widget: Text
        text: "Shaped text with real kerning and ligatures: fi fl ffi. This line wraps at the container width."
        style: {color: on_surface_variant, font_size: 14}

  # --- card variants ---
  - id: cards
    widget: Row
    style: {height: 56, spacing: 10, width: expand}
    children:
      - {id: card_e, widget: Card, style: {width: 150, variant: elevated}}
      - {id: card_f, widget: Card, style: {width: 150, variant: filled}}
      - {id: card_o, widget: Card, style: {width: 150, variant: outlined}}

  # --- tonal swatches ---
  - id: swatches
    widget: Row
    style: {height: 56, spacing: 10, width: expand}
    children:
      - {id: sw_primary,   widget: Container, style: {width: 56, height: 56, background: primary, corner_radius: 12}}
      - {id: sw_secondary, widget: Container, style: {width: 56, height: 56, background: secondary, corner_radius: 12}}
      - {id: sw_tertiary,  widget: Container, style: {width: 56, height: 56, background: tertiary, corner_radius: 12}}
      - {id: sw_error,     widget: Container, style: {width: 56, height: 56, background: error, corner_radius: 12}}
      - {id: sw_outline,   widget: Container, style: {width: 56, height: 56, background: surface_container_highest, corner_radius: 12, border: {width: 2, color: outline}}}

  # --- icons: Material Symbols, with the FILL axis driving selected state ---
  - id: icons
    widget: Row
    style: {height: 40, spacing: 14, width: expand, cross_alignment: center}
    children:
      - {id: ic_home,   widget: Icon, text: home,     style: {color: on_surface, icon_size: 24}}
      - {id: ic_search, widget: Icon, text: search,   style: {color: on_surface, icon_size: 24}}
      - {id: ic_set,    widget: Icon, text: settings, style: {color: on_surface_variant, icon_size: 24}}
      - id: ic_fav
        widget: Icon
        text: "{{ 'favorite' if clicks.get() else 'favorite_border' }}"
        style: {color: error, icon_size: 28, icon_fill: 1.0}
      - {id: ic_heavy,  widget: Icon, text: bolt, style: {color: tertiary, icon_size: 24, icon_weight: 700}}
      - {id: ic_gap,    widget: Spacer, style: {width: expand}}
      - {id: ic_check,  widget: Icon, text: check_circle, style: {color: primary, icon_size: 24, icon_fill: 1.0}}

  # --- stack: a badge overlaid on a surface ---
  - id: stacked
    widget: Stack
    style: {height: 64, align_x: 1.0, align_y: 0.0}
    children:
      - id: stack_base
        widget: Container
        style: {width: expand, height: 64, background: surface_container, corner_radius: 12}
      - id: badge
        widget: Container
        style: {width: 28, height: 28, background: error, corner_radius: 14}

  - id: div1
    widget: Divider
    style: {width: expand}

  # --- selection controls, driven by the `value:` binding ---
  - id: controls
    widget: Row
    style: {height: 40, spacing: 16, width: expand, cross_alignment: center}
    children:
      - {id: cb_on,  widget: Checkbox, value: "{{ clicks.get() }}"}
      - {id: cb_off, widget: Checkbox, value: "false"}
      - {id: rd_on,  widget: Radio,    value: "true"}
      - {id: rd_off, widget: Radio,    value: "false"}
      - {id: sw,     widget: Switch,   value: "{{ dark.get() }}"}
      - {id: chip_f, widget: Chip, text: "Filter", style: {variant: filter}, value: "{{ clicks.get() }}"}
      - {id: chip_a, widget: Chip, text: "Assist", style: {variant: assist}}
      - {id: ctl_gap, widget: Spacer, style: {width: expand}}
      - {id: badge,  widget: Badge, value: "{{ clicks.get() }}"}

  # --- icon buttons and FABs ---
  - id: fabs
    widget: Row
    style: {height: 56, spacing: 12, width: expand, cross_alignment: center}
    children:
      - {id: ib_std,   widget: IconButton, text: favorite, style: {variant: standard}}
      - {id: ib_fill,  widget: IconButton, text: star,     style: {variant: filled}}
      - {id: ib_tonal, widget: IconButton, text: share,    style: {variant: filled_tonal}}
      - {id: ib_out,   widget: IconButton, text: settings, style: {variant: outlined}}
      - {id: fab_gap,  widget: Spacer, style: {width: expand}}
      - {id: fab_sm,   widget: Fab, text: add,  style: {variant: small}}
      - {id: fab_std,  widget: Fab, text: edit, style: {variant: standard}}

  # --- action row ---
  - id: actions
    widget: Row
    style: {height: 44, spacing: 12, width: expand}
    children:
      - id: count_label
        widget: Text
        text: "Clicked {{ clicks.get() }}x"
        style: {color: on_surface_variant, font_size: 14}
      - id: actions_gap
        widget: Spacer
        style: {width: expand}
      - id: reset_btn
        widget: Button
        text: "Reset"
        style: {width: 100, height: 40, variant: outlined}
        handlers: {on_click: reset}
      - id: confirm_btn
        widget: Button
        text: "Confirm"
        style: {width: 130, height: 40, variant: filled}
        handlers: {on_click: confirm}
