# An M3 type scale for pyCopper, supplied as data.
#
#   type_scale: {source: typescale.yaml}
#
# ---------------------------------------------------------------------------
# READ THIS BEFORE TRUSTING THE NUMBERS.
#
# pyCopper ships no type-scale figures of its own, and this file is not an
# exception dressed up as one. Of M3's fifteen baseline roles, only four appear
# with a size anywhere in the project's reference library. Those four are below
# and are marked. The rest are absent, and one -- headline-large -- appears in
# the library with TWO DIFFERENT VALUES (32sp and 36sp, in the same file), so
# even it is not settled.
#
# The authoritative table lives at:
#     https://m3.material.io/styles/typography/type-scale-tokens
# It scraped as an empty interactive widget, which is why it is not here.
#
# Fill in the commented roles from that page before using them. Naming a role
# with no entry is a load error that tells you which one is missing -- that is
# deliberate, so an unsourced size can never quietly become a default.
# ---------------------------------------------------------------------------

# Corroborated by M3_COMPONENT_SPECS.md in the reference library:
headline-medium: 28   # app bar, expanded (medium)
title-large: 22       # app bar title, small/centre-aligned
title-small: 14
label-medium: 12

# Contradictory in the library -- 32sp in one place, 36sp in another. Pick one
# from the spec page rather than from here:
# headline-large: ?

# Not present in the library at all. Copy them from the spec page:
# display-large:   ?
# display-medium:  ?
# display-small:   ?
# headline-small:  ?
# title-medium:    ?
# body-large:      ?
# body-medium:     ?
# body-small:      ?
# label-large:     ?
# label-small:     ?
