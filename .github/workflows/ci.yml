name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
        exclude:
          # bittty (the Terminal backend) pulls pywinpty on Windows, whose
          # Rust extension needs PyO3 -- which doesn't support 3.14 yet
          # upstream. Not a pyCopper bug; drop this one cell until it does.
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      # No GPU adapter on hosted runners: proves the framework's logic is
      # genuinely GPU-free (ARCHITECTURE.md 11).
      - run: pytest -m "not gpu" --cov=pycopper --cov-report=term-missing

  golden:
    name: golden images (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Software Vulkan: deterministic rasterisation, identical every run.
      - run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
      - run: pip install -e ".[dev]"
      - env:
          WGPU_FORCE_ADAPTER: cpu
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: pytest -m gpu -v
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: tests/golden/failures/

  # Temporary, workflow_dispatch-only: regenerates the "arc" baseline under
  # lavapipe (the golden job's own software Vulkan), since the committed
  # baseline was captured on a real GPU and lavapipe draws that arc's
  # antialiased edge ~0.2% differently -- stable and reproducible, not a
  # regression. Never runs on a push/PR. Remove this job once the
  # regenerated baseline is committed and the golden job is green.
  regen-arc-baseline:
    if: github.event_name == 'workflow_dispatch'
    name: regenerate arc baseline (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
      - run: pip install -e ".[dev]"
      - env:
          WGPU_FORCE_ADAPTER: cpu
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYCOPPER_REGEN_GOLDEN: "1"
        run: pytest tests/golden/test_baselines.py::test_arc_baseline -m gpu -v
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: arc-baseline-lavapipe
          path: tests/golden/baselines/arc.png
